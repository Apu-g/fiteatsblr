<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Never Ending Story: Building a Seamless Infinite Scroll Experience with Lenis + GSAP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Ms+Madi&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/druk-trial" rel="stylesheet">
                
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="content">
 


            <section class="hero">
                <picture class="hero-image">
                    <img src="./assets/01.webp" alt="Hero Image 1" />
                </picture>
            </section>

            <section class="hero">
                <picture class="hero-image">
                    <img src="./assets/02.webp" alt="Hero Image 2" />
                </picture>
            </section>

            <section class="hero">
                <picture class="hero-image">
                    <img src="./assets/03.webp" alt="Hero Image 3" />
                </picture>
            </section>

            <!-- Repeated First section for infinite scroll -->
            <section class="hero" aria-hidden="true">
                <picture class="hero-image" aria-hidden="true">
                    <img src="./assets/01.webp" alt="Hero Image 1 Duplicate" aria-hidden="true" />
                </picture>
            </section>



        </div>
    </div>
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
    <script src="https://unpkg.com/lenis@1.3.23/dist/lenis-snap.min.js"></script>
    <script src="./scripts.js"></script>
</body>
</html>
